<button
  id="createButton"
  tuiButton
  size="s"
  type="button"
  (click)="addProduct()"
>
  {{actions.add}}
</button>

<table tuiTable size="s">
  <thead>
  <tr>
    <th tuiTh>{{ productTableColumns.id }}</th>
    <th tuiTh>{{ productTableColumns.name }}</th>
    <th tuiTh>{{ productTableColumns.price }}</th>
    <th tuiTh>{{ productTableColumns.vat }}</th>
    <th tuiTh>{{ productTableColumns.actions }}</th>
  </tr>
  </thead>
  <tbody tuiTbody>
    @for (product of products(); track product.id) {
      <tr>
        <td tuiTd>{{ product.id }}</td>
        <td tuiTd>{{ product.name }}</td>
        <td tuiTd>{{ product.price }}</td>
        <td tuiTd>{{ product.vat }}</td>
        <td tuiTd>
          <button
            appearance="flat"
            iconStart="@tui.ellipsis-vertical"
            tuiIconButton
            type="button"
            [tuiAppearanceState]="openedProductId === product.id ? 'hover' : null"
            [tuiDropdown]="content"
            [tuiDropdownOpen]="openedProductId === product.id"
            (tuiDropdownOpenChange)="
          openedProductId = $event ? product.id : null
        "
          ></button>

          <ng-template #content>
            <tui-data-list
              tuiDataListDropdownManager
              [size]="size"
            >
              <button tuiOption type="button" (click)="editProduct(product)">
                {{actions.edit}}
              </button>

              <button tuiOption type="button" (click)="deleteProduct(product.id)">
                {{actions.delete}}
              </button>
            </tui-data-list>
          </ng-template>
        </td>
      </tr>
    }
  </tbody>
</table>
